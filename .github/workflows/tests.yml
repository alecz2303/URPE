name: Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - 'URPE-*'

jobs:
  tests:
    # Runner elegido con la variable de repo CI_RUNNER: 'self-hosted' por
    # defecto (la computadora de Alecz); 'ubuntu-latest' cuando la máquina
    # local no está disponible. Cambiar la variable no toca este archivo.
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 8.4
        if: runner.environment == 'github-hosted'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          tools: composer

      - name: Setup Node.js 22
        if: runner.environment == 'github-hosted'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify preinstalled PHP 8.4
        run: |
          php8.4 -v
          php8.4 -m | grep -Eiq '^mbstring$'
          php8.4 -m | grep -Eiq '^pdo_sqlite$'
          php -r 'exit(PHP_VERSION_ID >= 80400 && PHP_VERSION_ID < 80500 ? 0 : 1);'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verify preinstalled Node.js 22
        run: |
          node -v
          npm -v
          node -e 'process.exit(process.versions.node.startsWith("22.") ? 0 : 1)'

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Run PHP tests
        run: php artisan test
