name: Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - 'URPE-*'

jobs:
  tests:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify preinstalled PHP 8.4
        run: |
          php8.4 -v
          php8.4 -m | grep -Eiq '^mbstring$'
          php8.4 -m | grep -Eiq '^pdo_sqlite$'
          php -r 'exit(PHP_VERSION_ID >= 80400 && PHP_VERSION_ID < 80500 ? 0 : 1);'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verify preinstalled Node.js 22
        run: |
          node -v
          npm -v
          node -e 'process.exit(process.versions.node.startsWith("22.") ? 0 : 1)'

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Run PHP tests
        run: php artisan test
